name = "director"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# No custom domain yet, so the workers.dev URL stays on. Turn it off once a custom domain/route is live.
workers_dev = true

[observability]
enabled = true

[vars]
# Model is swappable without a code change. gpt-6.1-sol is the default;
# gpt-6-luna is the ~20x cheaper fallback.
OPENAI_MODEL = "gpt-6.1-sol"
# Reasoning effort for the Responses API: low keeps latency down. Empty string omits the field.
OPENAI_REASONING_EFFORT = "low"
# Comma-separated site origins allowed to call the Worker. SET THIS AT DEPLOY to every origin the
# site is served from (add the custom domain once it exists). Browsers only; the default is safe
# out of the box. http://localhost:3000 is always allowed.
ALLOWED_ORIGINS = "https://db-25.github.io,https://db25.dev"
# Director requests allowed per UTC day across all visitors. Over it, POST /director answers 503
# {"error":"director_offline"} and the client falls back to the scripted tour. Counted in TTS_KV if
# bound (global), else the Cache API (per data center).
DIRECTOR_DAILY_BUDGET = "300"

# Option B: runtime cloned-voice TTS (ElevenLabs). OFF unless TTS_PROVIDER = "elevenlabs" and the
# secrets ELEVENLABS_API_KEY and ELEVENLABS_VOICE_ID exist. See docs/voice-plan.md.
TTS_PROVIDER = ""
# New (uncached) characters of speech allowed per UTC day. Over it, POST /tts answers 429.
TTS_DAILY_CHAR_BUDGET = "20000"
# Optional model override. Default eleven_flash_v2_5 (lowest latency, cheapest).
# TTS_MODEL = "eleven_flash_v2_5"

# Rate limiting binding (Cloudflare Workers Rate Limiting; `period` must be 10 or 60 seconds).
# Counts per hashed client IP, per Cloudflare location. The Worker also keeps a small in-memory
# limiter, which is the only one in effect when this binding is missing (e.g. `wrangler dev`).
# namespace_id is any positive integer string, unique within your account.
[[ratelimits]]
name = "DIRECTOR_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# Secret (never put in this file):  npx wrangler secret put OPENAI_API_KEY

# TTS rate limit (per hashed client IP, per location). Optional, same rules as DIRECTOR_LIMITER.
[[ratelimits]]
name = "TTS_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Optional global budget counters (TTS characters and Director requests) (the Cache API is the fallback, per data center). To use KV:
#   npx wrangler kv namespace create TTS_KV      then paste the printed id below and uncomment.
# [[kv_namespaces]]
# binding = "TTS_KV"
# id = "<namespace id>"

# Secrets (never put in this file):
#   npx wrangler secret put ELEVENLABS_API_KEY
#   npx wrangler secret put ELEVENLABS_VOICE_ID

# Visitors globe (the hidden easter egg, see src/visits.ts). POST /visit counts a visitor once per UTC day into a
# 5 degree cell; GET /visits returns the map. Both answer 503 {"error":"visits_offline"} until this is bound, and the
# site hides the egg entirely while /visits is unreachable. To turn it on:
#   npx wrangler kv namespace create VISITS_KV      then paste the printed id below and uncomment.
#   npx wrangler secret put VISIT_SALT              any long random string; it salts the per-day visitor hash. Keep it secret.
# KV free tier: 1,000 writes a day (each new visitor is 2), about 500 new visitors a day. Counter updates are not atomic.
# [[kv_namespaces]]
# binding = "VISITS_KV"
# id = "<namespace id>"
