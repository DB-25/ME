name = "director"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

[vars]
# Model is swappable without a code change. gpt-6.1-sol is the default;
# gpt-6-luna is the ~20x cheaper fallback.
OPENAI_MODEL = "gpt-6.1-sol"
# Reasoning effort for the Responses API: low keeps latency down. Empty string omits the field.
OPENAI_REASONING_EFFORT = "low"
# Comma-separated site origins allowed to call the Worker, e.g.
# "https://example.dev,https://db-25.github.io". http://localhost:3000 is always allowed.
ALLOWED_ORIGINS = ""

# Rate limiting binding (Cloudflare Workers Rate Limiting; `period` must be 10 or 60 seconds).
# Counts per hashed client IP, per Cloudflare location. The Worker also keeps a small in-memory
# limiter, which is the only one in effect when this binding is missing (e.g. `wrangler dev`).
# namespace_id is any positive integer string, unique within your account.
[[ratelimits]]
name = "DIRECTOR_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# Secret (never put in this file):  npx wrangler secret put OPENAI_API_KEY
